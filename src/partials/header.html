<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__logo" href="/">
      <img src="{{svg 'logo.svg'}}" width="28" height="28" alt="" />
      <span>{{siteName}}</span>
    </a>

    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="primary-nav"
      hidden
    >
      <span class="nav-toggle__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="nav-toggle__bars" d="M4 7h16M4 12h16M4 17h16" />
          <path class="nav-toggle__cross" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav class="primary-nav" id="primary-nav" aria-label="Primary">
      <ul class="primary-nav__list">
        <li>
          <a href="/" {{#if (eq page 'home')}}aria-current="page"{{/if}}>Home</a>
        </li>
        <li>
          <a href="/about/" {{#if (eq page 'about')}}aria-current="page"{{/if}}>About</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
